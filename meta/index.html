<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive look at the code and commit history behind Matthew Ramos's portfolio.">
    <title>Meta: Matthew Ramos</title>
    <link rel="stylesheet" href="../style.css?v=lab8">
    <script type="module" src="../global.js?v=lab6"></script>
    <script type="module" src="main.js?v=lab8"></script>
</head>
<body>
    <main class="meta">
        <h1>Meta</h1>
        <section aria-labelledby="stats-heading">
            <h2 id="stats-heading">Code at a glance</h2>
            <div id="stats" aria-live="polite" aria-busy="true">
                <p class="status-message">Loading code statistics…</p>
            </div>
        </section>
        <section aria-labelledby="commits-heading">
            <h2 id="commits-heading">Commits by time of day</h2>
            <div id="scrolly-1">
                <div id="scatter-story" aria-label="Commit history"><p>Loading commit history…</p></div>
                <div id="scatter-plot">
                    <label class="commit-filter" for="commit-progress">
                        <span>Show commits until:</span>
                        <time id="commit-time"></time>
                        <input id="commit-progress" type="range" min="0" max="100" value="100" step="0.1" disabled>
                    </label>
                    <p id="timeline-status" role="status"></p>
                    <div id="chart" aria-busy="true"></div>
                    <div class="selection-controls">
                        <p id="selection-count" role="status">No commits selected</p>
                        <button id="clear-selection" type="button" disabled>Clear selection</button>
                    </div>
                    <h3 id="language-heading">Languages in selected commits</h3>
                    <dl id="language-breakdown" class="stats" aria-labelledby="language-heading"></dl>
                </div>
            </div>
        </section>
        <section aria-labelledby="files-heading">
            <h2 id="files-heading">Which files grew the most?</h2>
            <p class="unit-key">1 dot = 1 line</p>
            <label class="commit-filter" for="file-progress">
                <span>Show files through:</span>
                <time id="file-time"></time>
                <input id="file-progress" type="range" min="0" max="100" value="100" step="0.1" disabled>
            </label>
            <ul id="file-legend" class="file-legend" aria-label="Line languages"></ul>
            <p id="file-status" class="status-message">Loading file sizes…</p>
            <dl id="files"></dl>
        </section>
        <dl id="commit-tooltip" class="info tooltip" hidden>
            <dt>Commit</dt>
            <dd><a id="commit-link" target="_blank" rel="noopener noreferrer"></a></dd>
            <dt>Date</dt><dd id="commit-date"></dd>
            <dt>Time</dt><dd id="tooltip-commit-time"></dd>
            <dt>Author</dt><dd id="commit-author"></dd>
            <dt>Lines</dt><dd id="commit-lines"></dd>
        </dl>
        <noscript><p>Enable JavaScript to explore the code statistics and commits.</p></noscript>
    </main>
</body>
</html>
