<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects: Matthew Ramos</title>
    <link rel="stylesheet" href="../style.css?v=lab5">
    <script type="module" src="../global.js?v=lab4-latest"></script>
    <script type="module" src="projects.js?v=lab5"></script>
</head>
<body>
    <main>
        <h1 class="projects-title">Projects</h1>
        <section class="project-overview" aria-labelledby="chart-heading">
            <h2 id="chart-heading">Projects by year</h2>
            <p id="chart-help">Select a slice or a year to filter projects. Select it again to show all years.</p>
            <div class="chart-container">
                <svg id="projects-pie-plot" viewBox="-52 -52 104 104" role="group" aria-labelledby="chart-heading" aria-describedby="chart-help"></svg>
                <ul class="legend" aria-label="Filter projects by year"></ul>
                <p class="chart-empty" hidden>No matching projects to chart.</p>
            </div>
            <p class="sample-note">2024 and 2025 contain labeled placeholders with sample years.</p>
        </section>
        <div class="project-search">
            <label for="project-search">Search projects</label>
            <input id="project-search" class="searchBar" type="search" placeholder="Search titles, descriptions, tools, or years…" autocomplete="off" disabled>
            <button class="clear-filters" type="button" hidden>Clear filters</button>
        </div>
        <p class="filter-status" role="status"></p>
        <div class="projects" aria-live="polite" aria-busy="true">
            <p class="status-message">Loading projects…</p>
        </div>
        <noscript><p>Enable JavaScript to see the project list.</p></noscript>
    </main>
</body>
</html>
